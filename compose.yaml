# The road routers (OSRM) for travel times, run in Docker: docker compose up -d
# One router per way of travelling, each serving the road network built for it in data/osrm:
# walking on http://localhost:5001, driving on http://localhost:5000.
x-osrm: &osrm
  image: ghcr.io/project-osrm/osrm-backend:v5.27.1
  # mld: the routing algorithm the road networks were built for. max-table-size: the most places
  # one table of travel times may have.
  command: osrm-routed --algorithm mld --max-table-size 500 /data/map.osrm
  restart: unless-stopped

services:
  osrm-walking:
    <<: *osrm
    volumes: ["./data/osrm/walking:/data:ro"]
    ports: ["5001:5000"]
  osrm-driving:
    <<: *osrm
    volumes: ["./data/osrm/driving:/data:ro"]
    ports: ["5000:5000"]
